name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: "TDS identity: 23f3002902@ds.study.iitm.ac.in"
        run: echo "23f3002902@ds.study.iitm.ac.in"
      - name: Test release gate
        run: pytest -q test_main.py

